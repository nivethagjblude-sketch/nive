# Cloudflare Workers + Pages config for moisturizer-watch.
# 1) npx wrangler login
# 2) npx wrangler kv namespace create MOISTURIZER_KV   -> paste the returned id below
# 3) npx wrangler secret put GMAIL_APP_PASSWORD   (and GMAIL_SENDER, GMAIL_RECIPIENT)
# 4) npm run deploy

name = "moisturizer-watch"
compatibility_date = "2025-09-01"
main = "worker/index.js"
pages_build_output_dir = "dashboard"

# --- Storage: Workers KV -------------------------------------------
kv_namespaces = [
  { binding = "MOISTURIZER_KV", id = "REPLACE_WITH_KV_NAMESPACE_ID", preview_id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

# --- Weekly automation: Sunday 01:00 UTC = 06:30 AM IST -------------
[triggers]
crons = [ "0 1 * * 0" ]